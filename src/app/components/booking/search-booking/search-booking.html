<div class="flex items-center gap-2 border-b">
  <input
    #searchInput
    type="text"
    placeholder="Search rooms, press Enter to search..."
    [value]="searchQuery()"
    (keydown.enter)="searchQueryChange.emit(searchInput.value)"
    class="w-full p-2" />
  <button class="p-2 h-6 flex items-center bg-gray-900 rounded" (click)="clearQuery.emit()">
    x
  </button>
</div>
