<div class="section">
  <input
    #createTask
    (keyup.enter)="addTask(createTask.value); createTask.value = ''"
    type="text"
    name="task"
    id="task"
    placeholder="Add a new task"
    class="p-2 mb-4 border border-b border-gray-300 w-75" />

  @if (tasks().length > 0) {
    <ul class="flex flex-wrap gap-2">
      @for (task of tasks(); track task.id) {
        <li class="flex items-center px-4 py-2 bg-gray-800 rounded-md gap-2">
          <span>{{ task.title }}</span>
          <button
            class="text-red-500 hover:text-red-700"
            aria-label="Remove task"
            (click)="removeTask(task.id)">
            &times;
          </button>
        </li>
      }
    </ul>
  }
</div>
