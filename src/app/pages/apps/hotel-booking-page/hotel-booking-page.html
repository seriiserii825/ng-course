<header class="flex justify-between items-center mb-4 w-full">
  <h1 class="text-2xl font-bold mb-4">Hotel Booking</h1>
  <div class="flex gap-4 mb-4">
    @if (availableRooms() > 0) {
      <div class="flex gap-2">Available Rooms: {{ availableRooms() }}</div>
    }
    @if (favorites() > 0) {
      <div class="flex gap-2">Favorites: {{ favorites() }}</div>
    }
  </div>
</header>
<div class="flex gap-8 items-center mb-8">
  <app-search-booking
    class="w-full max-w-xs"
    [searchQuery]="searchQuery()"
    (searchQueryChange)="onSearchQueryChange($event)"
    (clearQuery)="onClearQuery()" />
  <app-select-shared
    [label]="'Capacity'"
    [options]="capacityOptions()"
    [name]="'capacity'"
    [ngModel]="selected_capacity_option()"
    (ngModelChange)="onCapacityChange($event)" />
  <app-filter-status />
</div>
@if (isLoading()) {
  <app-preloader />
} @else {
  <app-rooms [rooms]="filtered_rooms()" />
}
