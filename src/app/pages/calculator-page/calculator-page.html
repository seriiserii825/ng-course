<div class="m-w-[600px] m-auto">
  <h2 class="title">Calculator</h2>
  <div class="flex items-center gap-4 mb-8">
    <app-input-shared [(ngModel)]="firstNumber" [name]="'first'" [type]="'number'" />
    <app-select-shared
      [(ngModel)]="operation"
      [name]="'operation'"
      [options]="operations"></app-select-shared>
    <app-input-shared [(ngModel)]="secondNumber" [name]="'second'" [type]="'number'" />
    <app-btn-shared
      [className]="'btn--primary'"
      [label]="'Calculate'"
      (clickEmit)="calculate()"></app-btn-shared>
  </div>
  <footer class="flex items-center gap-12 mb-8">
    @if (result !== null) {
      <div class="result">Result: {{ result }}</div>
    }
    <app-btn-shared
      [className]="'btn--danger'"
      [label]="'Reset'"
      (clickEmit)="reset()"></app-btn-shared>
  </footer>
</div>
