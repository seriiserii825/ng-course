<div class="relative">
  <div class="flex gap-4 items-center">
    @if (label()) {
      <label class="block text-sm text-slate-300 mb-1" [for]="name()">{{ label() }}</label>
    }
    <button
      [id]="name()"
      class="min-w-28 flex items-center justify-between gap-2 rounded-lg border border-slate-600 bg-slate-800 px-3 py-2 text-sm text-white cursor-pointer hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-emerald-500 transition-colors"
      [class.opacity-50]="disabled"
      [class.pointer-events-none]="disabled"
      (click)="toggleOpen()"
      (keydown)="onKeyDown($event)">
      <span class="truncate">{{ value?.label ?? 'Select…' }}</span>
      <svg
        class="w-4 h-4 shrink-0 text-slate-300 transition-transform"
        [class.rotate-180]="isOpen"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="2"
        stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
      </svg>
    </button>
  </div>
  @if (isOpen) {
    <div
      class="absolute top-full left-0 mt-1 w-full rounded-lg border border-slate-600 bg-slate-800 shadow-lg z-10 overflow-hidden">
      @for (option of options(); track option.value; let i = $index) {
        <button
          class="block w-full border-0 px-3 py-2 text-left text-sm text-white cursor-pointer hover:bg-slate-700"
          [class.bg-slate-700]="value?.value === option.value || activeIndex === i"
          (click)="selectOption(option)">
          {{ option.label }}
        </button>
      }
    </div>
  }
</div>
